#!/usr/sbin/nft -f
flush ruleset

table inet s25_killswitch {
  chain output {
    type filter hook output priority 0; policy accept;
    oifname "lo" accept
    oifname "tun0" accept
    udp dport 443 reject
    oifname "wlp2s0" udp dport { 67, 68 } accept
    oifname "wlp2s0" tcp dport 1080 accept
    oifname "wlp2s0" reject
  }
}
